<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Goal Goose demo recorder</title>
  <style>
    body { margin: 0; background: #222; color: #eee; font: 14px system-ui; }
    canvas#c { display: block; margin: 10px auto; width: 960px; height: 540px; background: #000; }
    #status { text-align: center; }
  </style>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="status">idle</div>
  <p style="text-align:center"><button id="rec" style="font:700 18px system-ui;padding:10px 22px">● Record demo</button></p>
  <script src="goose-stage.js"></script>
  <script>
    // All-live demo: the REAL 3D goose (same model + animation code as the extension) rendered every
    // frame, with an animated cursor and cards showing the real results from the logged test run.
    const W = 1280, H = 720, CAP = 110, FLOOR = H - CAP - 18;
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const status = (t) => (document.getElementById("status").textContent = t);
    const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
    const lerp = (a, b, k) => a + (b - a) * k;
    const seg = (t, a, b) => ease((t - a) / (b - a)); // 0..1 eased progress between a and b

    // ---- the goose ----
    const gCanvas = document.createElement("canvas");
    const G = window.GooseStage;
    const stage = G.createStage(gCanvas, 512);
    let goose;
    function newGoose() {
      if (goose) stage.scene.remove(goose.root);
      goose = new G.Goose();
      stage.scene.add(goose.root);
    }
    const GS = 470; // goose canvas size on screen

    // ---- particles ----
    let fx = [];
    const emit = (s, n, x, y) => { for (let i = 0; i < n; i++) fx.push({ s, x: x + (Math.random() - 0.5) * 80, y, vx: (Math.random() - 0.5) * 40, t: -i * 0.14 }); };
    function drawFx(dt) {
      ctx.save(); ctx.textAlign = "center";
      for (const p of fx) {
        p.t += dt; if (p.t < 0) continue;
        const k = p.t / 1.5;
        ctx.globalAlpha = Math.max(0, k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85);
        ctx.font = `${Math.round(34 + 10 * Math.min(1, k * 4))}px system-ui`;
        ctx.fillText(p.s, p.x + p.vx * p.t, p.y - 110 * p.t);
      }
      fx = fx.filter((p) => p.t < 1.5); ctx.restore();
    }

    // ---- UI helpers ----
    function card(x, y, w, h, appear, t, draw, opts = {}) {
      const k = seg(t, appear, appear + 0.45);
      if (k <= 0) return;
      ctx.save();
      ctx.globalAlpha = k * (opts.alpha ?? 1);
      ctx.translate(x + (1 - k) * 60 + w / 2, y + h / 2);
      const s = opts.scale ?? 1;
      ctx.rotate(opts.rot ?? 0);
      ctx.scale(s, s);
      ctx.translate(-w / 2, -h / 2);
      ctx.fillStyle = opts.bg ?? "#fffdf8"; ctx.strokeStyle = "#2a2220"; ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(60,30,20,.18)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
      ctx.beginPath(); ctx.roundRect(0, 0, w, h, 22); ctx.fill(); ctx.shadowColor = "transparent"; ctx.stroke();
      draw(w, h);
      ctx.restore();
    }
    function text(s, x, y, font, color = "#2a2220", maxW) {
      ctx.font = font; ctx.fillStyle = color;
      if (!maxW) return ctx.fillText(s, x, y);
      const words = s.split(" "); let line = ""; let yy = y;
      for (const w of words) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += parseInt(font.match(/(\d+)px/)[1]) * 1.3; } else line = test; }
      ctx.fillText(line, x, yy); return yy;
    }
    function chip(s, x, y, bg, fg = "#fff") {
      ctx.font = "800 15px system-ui"; const w = ctx.measureText(s).width + 20;
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y - 17, w, 26, 9); ctx.fill();
      ctx.fillStyle = fg; ctx.fillText(s, x + 10, y + 1); return w;
    }
    function videoThumb(x, y, w, h, kind) {
      ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.clip();
      if (kind === "lecture") {
        ctx.fillStyle = "#0e1a2b"; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "rgba(90,160,220,.55)"; ctx.lineWidth = 1.5;
        for (let i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(x + i * w / 8, y); ctx.lineTo(x + i * w / 8, y + h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y + i * h / 8); ctx.lineTo(x + w, y + i * h / 8); ctx.stroke(); }
        ctx.strokeStyle = "#f5c542"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + w / 2, y + h / 2); ctx.lineTo(x + w * 0.78, y + h * 0.3); ctx.stroke();
        ctx.strokeStyle = "#ff6b6b"; ctx.beginPath(); ctx.moveTo(x + w / 2, y + h / 2); ctx.lineTo(x + w / 2, y + h * 0.18); ctx.stroke();
        text("λ v = A v", x + 18, y + 34, "700 22px Georgia, serif", "#e8f1ff");
      } else {
        const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, "#ffd9a8"); g.addColorStop(1, "#ffb3c7");
        ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
        ctx.font = `${Math.round(h * 0.55)}px system-ui`; ctx.textAlign = "center"; ctx.fillText("🐱", x + w / 2, y + h * 0.72); ctx.textAlign = "left";
      }
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 26, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x + w / 2 - 8, y + h / 2 - 13); ctx.lineTo(x + w / 2 + 14, y + h / 2); ctx.lineTo(x + w / 2 - 8, y + h / 2 + 13); ctx.fill();
      ctx.restore();
    }
    function cursor(x, y, grab) {
      ctx.save(); ctx.font = "46px system-ui"; ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = 8; ctx.fillText(grab ? "✊" : "🖐️", x, y); ctx.restore();
    }
    function bubble(textS, cx, top, deep) {
      if (deep) textS = textS.toUpperCase();
      ctx.font = deep ? "italic 700 24px Georgia, serif" : "600 21px system-ui";
      const maxW = 420;
      const words = textS.split(" "); const lines = []; let line = "";
      for (const w of words) { const t2 = line ? line + " " + w : w; if (ctx.measureText(t2).width > maxW && line) { lines.push(line); line = w; } else line = t2; }
      lines.push(line);
      const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 34, bh = lines.length * 30 + 22;
      const bx = Math.max(16, Math.min(W - bw - 16, cx - bw / 2)), by = top - bh;
      ctx.fillStyle = deep ? "#141110" : "#fffdf8"; ctx.strokeStyle = deep ? "#141110" : "#2a2220"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 16); ctx.fill(); ctx.stroke();
      ctx.fillStyle = deep ? "#f3ece4" : "#2a2220";
      lines.forEach((l, i) => ctx.fillText(l, bx + 17, by + 34 + i * 30));
    }

    // ---- scene choreography (t = seconds into the scene) ----
    // Each returns { gx, lift, look } for the goose and draws its own cards.
    const once = (s, key, t, at, fn) => { if (t >= at && !s.done.has(key)) { s.done.add(key); fn(); } };
    const SCENES = [
      { id: "s1", kicker: "GOAL GOOSE", caption: "A focus goose that knows what you're actually doing",
        run(s, t) {
          // pet → pick up → toss → dizzy landing
          const gx = 640;
          let cx = lerp(1150, 700, seg(t, 0.2, 1.2)), cy = lerp(200, 330, seg(t, 0.2, 1.2));
          let lift = 0, grab = false;
          if (t > 1.2 && t < 3.2) { cx = 640 + Math.sin((t - 1.2) * 7) * 70; cy = 330 + Math.cos((t - 1.2) * 14) * 10; goose.petting = true; }
          else goose.petting = false;
          once(s, "h1", t, 1.5, () => emit("💗", 2, gx, FLOOR - GS * 0.72));
          once(s, "h2", t, 2.3, () => emit("💗", 3, gx, FLOOR - GS * 0.72));
          once(s, "w", t, 2.6, () => goose.play("wiggle"));
          if (t >= 3.3 && t < 4.6) { grab = true; goose.mood = "held"; lift = 120 * seg(t, 3.3, 3.8); cx = gx + 10; cy = FLOOR - GS * 0.62 - lift + 40; }
          if (t >= 4.6) {
            if (!s.done.has("drop")) { s.done.add("drop"); s.vy = -420; s.y = 120; goose.mood = "idle"; }
            s.y = Math.max(0, s.y - s.vy * s.dt); s.vy += 2600 * s.dt;
            if (s.y === 0 && !s.done.has("land")) { s.done.add("land"); goose.play("land"); goose.mood = "dizzy"; emit("💫", 2, gx, FLOOR - GS * 0.72); }
            lift = s.y; cx = lerp(gx + 10, 1000, seg(t, 4.7, 5.6)); cy = lerp(FLOOR - GS * 0.62 - 80, 260, seg(t, 4.7, 5.6));
          }
          s.cursor = [cx, cy, grab];
          return { gx, lift, look: [(cx - gx) / 500, (cy - (FLOOR - GS * 0.75)) / 300] };
        } },
      { id: "cute", kicker: "SUPER PETTABLE", caption: "Petting, dancing when you focus, napping when you don't need him",
        run(s, t) {
          const gx = 640;
          once(s, "hop", t, 0.2, () => { goose.mood = "happy"; goose.play("hop"); });
          once(s, "dance", t, 1.0, () => { goose.mood = "idle"; goose.play("dance"); emit("✨", 3, gx, FLOOR - GS * 0.72); });
          once(s, "nap", t, 4.2, () => { goose.mood = "nap"; emit("💤", 1, gx + 60, FLOOR - GS * 0.7); });
          once(s, "z", t, 5.2, () => emit("💤", 1, gx + 60, FLOOR - GS * 0.7));
          return { gx, lift: 0, look: [0, 0] };
        } },
      { id: "s2", kicker: "gemini-4-neon · plans the session", caption: "Your goal → what counts as on track, and where home is",
        run(s, t) {
          const gx = 340;
          once(s, "think", t, 0.1, () => { goose.mood = "think"; emit("❔", 1, gx, FLOOR - GS * 0.75); });
          once(s, "nod", t, 4.5, () => { goose.mood = "idle"; goose.play("nod"); });
          card(620, 70, 620, 430, 0.3, t, (w) => {
            text("YOUR GOAL", 32, 46, "800 15px system-ui", "#9a7b5a");
            text("🪿 Study linear algebra for my midterm", 32, 84, "800 27px system-ui");
            chip("planned by gemini-4-neon", 32, 124, "#2a2220", "#ffd23f");
            text("ON TRACK", 32, 178, "800 15px system-ui", "#2f9e57");
            text("Textbooks, lecture notes, practice exams, matrix calculators, videos on vectors, matrices and eigenvalues", 32, 206, "500 19px system-ui", "#2a2220", 556);
            text("OFF TRACK", 32, 290, "800 15px system-ui", "#c8413a");
            text("Social feeds, entertainment, unrelated videos, news, shopping", 32, 318, "500 19px system-ui", "#2a2220", 556);
            text("HOME BASE", 32, 376, "800 15px system-ui", "#9a7b5a");
            text("khanacademy.org/math/linear-algebra", 32, 404, "600 19px system-ui");
          });
          return { gx, lift: 0, look: [0.6, -0.2] };
        } },
      { id: "s3", kicker: "gemini-decision-1 · every page", caption: "3Blue1Brown lecture → on track (p = 0.96)",
        run(s, t) {
          const gx = 340;
          once(s, "a", t, 0.1, () => (goose.mood = "think"));
          once(s, "b", t, 2.2, () => { goose.mood = "happy"; emit("💗", 2, gx, FLOOR - GS * 0.72); });
          once(s, "c", t, 3.4, () => { goose.mood = "idle"; goose.play("hop"); });
          card(640, 90, 580, 400, 0.2, t, (w) => {
            videoThumb(24, 24, w - 48, 230, "lecture");
            text("Eigenvectors and eigenvalues | Essence of linear algebra", 24, 292, "800 20px system-ui", "#2a2220", w - 48);
            text("3Blue1Brown · YouTube", 24, 348, "500 16px system-ui", "#7a6a62");
            if (t > 2) chip("✓ ON TRACK  ·  p = 0.96  ·  Decision 1", 24, 378, "#2f9e57");
          });
          return { gx, lift: 0, look: [0.7, -0.1] };
        } },
      { id: "s4", kicker: "gemini-4-hydrogen · writes the warnings", caption: "Cat compilation → off track ×3 (p = 0.04)",
        run(s, t) {
          const gx = 340;
          once(s, "a", t, 0.6, () => { goose.mood = "stare"; emit("❗", 1, gx, FLOOR - GS * 0.78); });
          once(s, "b", t, 2.6, () => { goose.mood = "warn"; goose.play("honk"); emit("💢", 1, gx, FLOOR - GS * 0.78); });
          card(640, 90, 580, 400, 0.1, t, (w) => {
            videoThumb(24, 24, w - 48, 230, "cat");
            text("You Can't Stop Laughing At These Cats 😂", 24, 292, "800 20px system-ui", "#2a2220", w - 48);
            text("YouTube", 24, 324, "500 16px system-ui", "#7a6a62");
            if (t > 1) chip("✗ OFF TRACK ×3  ·  p = 0.04", 24, 362, "#c8413a");
          });
          if (t > 2.7) bubble("Funny cats compilation instead of eigenvectors? Final warning! Back to linear algebra! HONK!", gx + 40, FLOOR - GS * 0.86, false);
          return { gx, lift: 0, look: [0.8, -0.1] };
        } },
      { id: "s5", kicker: "The Manager · Decision 1 + Neon", caption: "Eat approved in 1.5 s · won't lose work (96%) · return page on-goal (94%)", extra: "deep-eat.wav",
        run(s, t) {
          // manager card, then the goose waddles over and eats the cat video
          let gx = 340;
          const eatAt = 5.4;
          once(s, "a", t, 0.1, () => (goose.mood = "warn"));
          if (t < eatAt - 1.4) card(640, 110, 580, 160, 0.2, t, () => {
            text("👔 THE MANAGER", 28, 44, "800 16px system-ui", "#9a7b5a");
            text("eat?  ✓ approved in 1.5 s", 28, 84, "800 26px system-ui");
            chip("would lose work: 4%", 28, 124, "#2a2220", "#fff");
            chip("return page on-goal: 94%", 230, 124, "#2a2220", "#fff");
          });
          // cat video card waiting to be eaten
          const vx = 760, vy = 290, vw = 420, vh = 236;
          if (t >= eatAt - 2.2) {
            once(s, "walk", t, eatAt - 2.2, () => { goose.mood = "idle"; goose.facing = 1; goose.speed = 1; goose.play("honk"); });
            gx = lerp(340, 560, seg(t, eatAt - 2.2, eatAt - 0.4));
            once(s, "stop", t, eatAt - 0.4, () => { goose.speed = 0; goose.facing = 0; goose.mood = "gulp"; });
          }
          if (t < eatAt + 1.2) {
            const u = seg(t, eatAt, eatAt + 1.15);
            const bx = gx + GS * 0.06, by = FLOOR - GS * 0.6; // beak
            const cx = lerp(vx + vw / 2, bx, u), cy = lerp(vy + vh / 2, by, u), sc = 1 - 0.97 * u;
            ctx.save(); ctx.globalAlpha = t < eatAt - 2.6 ? seg(t, 0.2, 0.6) : 1 - 0.6 * u;
            ctx.translate(cx, cy); ctx.rotate(u * 0.6); ctx.scale(sc, sc);
            ctx.fillStyle = "#fffdf8"; ctx.strokeStyle = "#2a2220"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.roundRect(-vw / 2 - 14, -vh / 2 - 14, vw + 28, vh + 28, 18); ctx.fill(); ctx.stroke();
            videoThumb(-vw / 2, -vh / 2, vw, vh, "cat"); ctx.restore();
          }
          once(s, "gulp", t, eatAt + 1.2, () => { goose.mood = "idle"; goose.play("burp"); emit("✨", 3, gx, FLOOR - GS * 0.72); });
          if (t > eatAt + 1.3 && t < eatAt + 2.6) bubble("*gulp*", gx, FLOOR - GS * 0.86, false);
          const deepAt = s.narr + 0.25;
          once(s, "deep", t, deepAt, () => (goose.mood = "stare"));
          if (t > deepAt) bubble("Distraction. Consumed.", gx, FLOOR - GS * 0.86, true);
          return { gx, lift: 0, look: t > deepAt ? [0, 0] : [0.7, 0] };
        } },
      { id: "s6", kicker: "Back to work", caption: "Switched straight back to the open lecture tab",
        run(s, t) {
          const gx = 340;
          once(s, "a", t, 0.3, () => { goose.mood = "happy"; goose.play("hop"); emit("✨", 3, gx, FLOOR - GS * 0.72); });
          card(640, 90, 580, 400, 0.15, t, (w) => {
            videoThumb(24, 24, w - 48, 230, "lecture");
            text("↩ Back to: Eigenvectors and eigenvalues", 24, 294, "800 21px system-ui", "#2a2220", w - 48);
            text("The cat tab became an “eaten” page showing your goal.", 24, 334, "500 17px system-ui", "#7a6a62", w - 48);
            chip("✓ ON TRACK  ·  p = 0.96", 24, 380, "#2f9e57");
          });
          return { gx, lift: 0, look: [0.6, -0.1] };
        } },
      { id: "s7", kicker: "Built today at the Gemini 4 NYC Hackathon", caption: "github.com/JohnathanWeisner/goal-goose",
        run(s, t) {
          const gx = 640;
          once(s, "a", t, 0.1, () => { goose.play("dance"); emit("✨", 4, gx, FLOOR - GS * 0.72); });
          ctx.save(); ctx.textAlign = "center"; ctx.globalAlpha = seg(t, 0.1, 0.6);
          text("Goal Goose", 640, 96, "900 64px ui-rounded, system-ui", "#2a2220"); ctx.restore();
          return { gx, lift: 0, look: [0, 0] };
        } },
    ];

    async function run() {
      const ac = new AudioContext();
      await ac.resume();
      const dest = ac.createMediaStreamDestination();
      const buf = async (f) => ac.decodeAudioData(await (await fetch(f)).arrayBuffer());
      for (const s of SCENES) {
        s.buffer = await buf(`${s.id}.wav`);
        s.narr = s.buffer.duration;
        if (s.extra) s.extraBuf = await buf(s.extra);
        s.dur = s.narr + 0.3 + (s.extra ? s.extraBuf.duration + 0.35 : 0);
      }
      const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
      const mime = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus"].find((m) => MediaRecorder.isTypeSupported(m));
      const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.start(250);

      const t0 = ac.currentTime + 0.2;
      let at = t0;
      for (const s of SCENES) {
        s.start = at;
        const src = ac.createBufferSource(); src.buffer = s.buffer; src.connect(dest); src.start(at);
        if (s.extra) { const x = ac.createBufferSource(); x.buffer = s.extraBuf; x.connect(dest); x.start(at + s.narr + 0.25); }
        at += s.dur;
      }
      const end = at + 0.4;

      let current = null, last = ac.currentTime;
      await new Promise((done) => {
        (function frame() {
          const now = ac.currentTime, dt = Math.min(0.05, now - last); last = now;
          const s = SCENES.findLast((x) => now >= x.start) ?? SCENES[0];
          if (s !== current) { current = s; newGoose(); fx = []; s.done = new Set(); s.cursor = null; }
          s.dt = dt;
          drawFrame(s, Math.max(0, now - s.start), dt);
          status(`recording ${(now - t0).toFixed(1)}s / ${(end - t0).toFixed(1)}s`);
          if (now < end) requestAnimationFrame(frame); else done();
        })();
      });
      rec.stop();
      await new Promise((r) => (rec.onstop = r));
      const blob = new Blob(chunks, { type: mime });
      const name = mime.startsWith("video/mp4") ? "demo.mp4" : "demo.webm";
      await fetch(`/upload?name=${name}`, { method: "POST", body: blob });
      status(`saved ${name} (${(blob.size / 1e6).toFixed(1)} MB, ${mime})`);
      window.__done = { name, size: blob.size, seconds: end - t0 };
    }

    function drawFrame(s, t, dt) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#fbf6ec"); bg.addColorStop(1, "#efe3d0");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H - CAP); ctx.clip();

      const { gx, lift, look } = s.run(s, t);
      goose.setLook(look[0], look[1]);
      goose.update(dt);
      stage.render();
      ctx.drawImage(gCanvas, gx - GS / 2, FLOOR - GS - lift, GS, GS);
      drawFx(dt);
      if (s.cursor) cursor(...s.cursor);
      ctx.restore();

      ctx.fillStyle = "#2a2220"; ctx.fillRect(0, H - CAP, W, CAP);
      text(s.kicker, 40, H - 72, "700 20px system-ui", "#ffd23f");
      text(s.caption, 40, H - 32, "600 30px system-ui", "#fffaf0");
      const fade = Math.min(1, t / 0.25, (s.dur - t) / 0.25);
      if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - Math.max(0, fade)})`; ctx.fillRect(0, 0, W, H); }
    }

    window.runDemo = run;
    document.getElementById("rec").onclick = async () => { document.getElementById("rec").disabled = true; try { await run(); } catch (e) { status("error: " + e); window.__done = { error: String(e) }; console.error(e); } };
  </script>
</body>
</html>
