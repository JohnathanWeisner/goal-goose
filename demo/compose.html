<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Goal Goose demo recorder</title>
  <style>
    body { margin: 0; background: #222; color: #eee; font: 14px system-ui; }
    canvas { display: block; margin: 10px auto; width: 960px; height: 540px; background: #000; }
    #status { text-align: center; }
  </style>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="status">idle</div>
  <p style="text-align:center"><button id="rec" style="font:700 18px system-ui;padding:10px 22px">● Record demo</button></p>
  <script>
    // Renders scenes (screenshot + caption + narration) onto a canvas and records it with MediaRecorder.
    const W = 1280, H = 720;
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const status = (t) => (document.getElementById("status").textContent = t);
    const load = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });

    async function run() {
      const scenes = await (await fetch("scenes.json", { cache: "no-store" })).json();
      const ac = new AudioContext();
      await ac.resume();
      const dest = ac.createMediaStreamDestination();
      for (const s of scenes) {
        s.image = await load(s.img);
        s.buffer = await ac.decodeAudioData(await (await fetch(s.audio)).arrayBuffer());
        if (s.extra) s.extraBuf = await ac.decodeAudioData(await (await fetch(s.extra.audio)).arrayBuffer());
        s.dur = s.buffer.duration + (s.pad ?? 0.5) + (s.extra ? s.extraBuf.duration + 0.3 : 0);
      }
      const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
      const mime = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus"].find((m) => MediaRecorder.isTypeSupported(m));
      const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
      const chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.start(250);

      const t0 = ac.currentTime + 0.2;
      let at = t0;
      for (const s of scenes) {
        s.start = at;
        const src = ac.createBufferSource();
        src.buffer = s.buffer; src.connect(dest); src.start(at);
        if (s.extra) {
          const x = ac.createBufferSource();
          x.buffer = s.extraBuf; x.connect(dest);
          x.start(at + s.buffer.duration + 0.25);
        }
        at += s.dur;
      }
      const end = at + 0.4;

      await new Promise((done) => {
        (function draw() {
          const now = ac.currentTime;
          const s = scenes.findLast((x) => now >= x.start) ?? scenes[0];
          const k = Math.min(1, Math.max(0, (now - s.start) / s.dur));
          drawScene(s, k, now - s.start);
          status(`recording ${(now - t0).toFixed(1)}s / ${(end - t0).toFixed(1)}s`);
          if (now < end) requestAnimationFrame(draw); else done();
        })();
      });
      rec.stop();
      await new Promise((r) => (rec.onstop = r));
      const blob = new Blob(chunks, { type: mime });
      const name = mime.startsWith("video/mp4") ? "demo.mp4" : "demo.webm";
      await fetch(`/upload?name=${name}`, { method: "POST", body: blob });
      status(`saved ${name} (${(blob.size / 1e6).toFixed(1)} MB, ${mime})`);
      window.__done = { name, size: blob.size, mime, seconds: end - t0 };
    }

    function drawScene(s, k, t) {
      ctx.fillStyle = "#f7efe2";
      ctx.fillRect(0, 0, W, H);
      // Slow push-in (Ken Burns) toward the scene's focus point
      const img = s.image;
      const zoom = (s.zoomFrom ?? 1) + ((s.zoomTo ?? 1.06) - (s.zoomFrom ?? 1)) * ease(k);
      const fit = Math.min(W / img.width, (H - 110) / img.height);
      const w = img.width * fit * zoom, h = img.height * fit * zoom;
      const fx = s.focus?.[0] ?? 0.5, fy = s.focus?.[1] ?? 0.5;
      const x = W / 2 - w * fx + (w - img.width * fit) * 0 , y = (H - 110) / 2 - h * fy + h / 2 - (h - img.height * fit) * (fy - 0.5) * 0;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, H - 110); ctx.clip();
      ctx.drawImage(img, W / 2 - w * fx + (w / 2 - w * 0.5), (H - 110) / 2 - h * fy + (h / 2 - h * 0.5) + h * (fy - 0.5) * 0, w, h);
      ctx.restore();
      // Caption bar
      ctx.fillStyle = "#2a2220";
      ctx.fillRect(0, H - 110, W, 110);
      ctx.fillStyle = "#ffd23f";
      ctx.font = "700 20px system-ui";
      ctx.fillText(s.kicker ?? "", 40, H - 72);
      ctx.fillStyle = "#fffaf0";
      ctx.font = "600 30px system-ui";
      ctx.fillText(s.caption ?? "", 40, H - 32);
      // Fade in/out
      const fade = Math.min(1, t / 0.35, (s.dur - t) / 0.35);
      if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - Math.max(0, fade)})`; ctx.fillRect(0, 0, W, H); }
    }
    const ease = (x) => x * x * (3 - 2 * x);
    window.runDemo = run;
    document.getElementById("rec").onclick = async () => { document.getElementById("rec").disabled = true; try { await run(); } catch (e) { status("error: " + e); window.__done = { error: String(e) }; } };
  </script>
</body>
</html>
